name: Android UI Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Enable KVM virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-rules.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Grant execute permission for gradlew
        run: chmod +x src/gradlew
        
      - name: Run Android UI Tests in Emulator
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          disable-animations: true
          working-directory: ./src
          script: ./gradlew app:connectedAndroidTest --continue || true

      - name: Check Test Results & Report Failures
        run: |
          echo "=========================================="
          echo "           FAILED TESTS SUMMARY           "
          echo "=========================================="
          if grep -q -r "<failure" src/app/build/outputs/androidTest-results/connected/; then
            find src/app/build/outputs/androidTest-results/connected/ -name "*.xml" -exec grep -H -C 5 "<failure" {} +
            echo "------------------------------------------"
            echo "UI Tests Failed! See details above."
            exit 1
          else
            echo "All UI Tests Passed Successfully!"
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: src/app/build/reports/androidTests/connected/
